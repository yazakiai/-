<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>間取りスケッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFAF8;--ink:#26303B;--muted:#6B7480;--line:#E3E5E8;--red:#D2402D;--tray:#F3F4F5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:env(safe-area-inset-top) 6px 0 10px;height:calc(52px + env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:none;background:none;padding:6px 6px 6px 0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;border-radius:10px}
.brand>svg{flex:none}
.pn{display:flex;flex-direction:column;min-width:0;line-height:1.3}
#planName{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveState{font-size:10.5px;color:var(--muted);white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(38,48,59,.35)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:84vh;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:6px 16px calc(14px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:16px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.sheet-head b{font-size:16px}
.sheet-actions{display:flex;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sheet button.sb{flex:none;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.sheet button.sb.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.sheet button.sb.danger{color:var(--red)}
#planList{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.prow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);min-height:62px}
.popen{flex:1;min-width:0;text-align:left;border:none;background:none;padding:6px 4px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:3px;border-radius:8px}
.popen:active{background:#EEF0F2}
.pname{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:12px;color:var(--muted)}
.pmeta em{font-style:normal;color:var(--red);margin-right:8px}
.pinput{flex:1;min-width:0;height:40px;border:1px solid var(--ink);border-radius:8px;padding:0 10px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text}
.sheet-note{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0 0}
.empty{color:var(--muted);font-size:13px;padding:16px 0}
.fin-sheet .sheet-bg{background:rgba(38,48,59,.12)}
body.is3d .fin-sheet .sheet-panel{max-height:56vh}
.fin-body{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;padding-bottom:6px}
.fsec{padding:12px 0;border-bottom:1px solid var(--line)}
.fsec:last-child{border-bottom:none}
.fsec h4{margin:0 0 8px;font-size:13px;font-weight:700}
.fsec h5{margin:10px 0 6px;font-size:12px;font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:34px;padding:0 10px 0 6px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.chip.txt{padding:0 12px}
.chip i{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.15);flex:none}
.chip.on,.fl.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.fl{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px;font:inherit;font-size:11px;cursor:pointer;color:var(--ink);text-align:center}
.fl img{display:block;width:100%;height:50px;object-fit:cover;border-radius:5px;margin-bottom:4px}
.fin-body input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;cursor:pointer}
.sub{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.hb{display:flex;align-items:center;gap:2px}
.ib{width:40px;height:40px;border:none;background:none;border-radius:10px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.ib:disabled{opacity:.28;cursor:default}
.ib:not(:disabled):active{background:#EEF0F2}
.vr{width:1px;height:22px;background:var(--line);margin:0 4px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;overscroll-behavior:none}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);
  border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:12px;color:var(--muted);
  pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#floorTabs{position:absolute;left:10px;top:52px;display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:2;box-shadow:0 2px 8px rgba(38,48,59,.08)}
#floorTabs button{min-width:46px;height:36px;border:none;background:#fff;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
#floorTabs button.on{background:var(--ink);color:#fff}
body.is3d #floorTabs{display:none}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px}
#zoom .ib{width:36px;height:36px}
#zoomLabel{font-size:12px;min-width:44px;text-align:center;color:var(--muted);cursor:pointer}
#scale{position:absolute;left:12px;bottom:14px;font-size:11px;color:var(--muted);pointer-events:none;display:flex;align-items:center;gap:6px}
#scale i{display:inline-block;height:6px;border:1px solid var(--muted);border-top:none}
#ctx{flex:none;min-height:54px;display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#ctx::-webkit-scrollbar,#tray::-webkit-scrollbar{display:none}
#bar3d button,#ctx button,#ctx select,#ctx input{flex:none;height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px}
#bar3d button,#ctx button{padding:0 12px;cursor:pointer;white-space:nowrap}
#ctx button:disabled{opacity:.35}
#bar3d button.pri,#ctx button.pri{background:var(--ink);border-color:var(--ink);color:#fff}
#bar3d button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#ctx button.danger{color:var(--red)}
#ctx select{padding:0 6px}
#ctx input{width:112px;padding:0 10px;-webkit-user-select:text;user-select:text}
#ctx input.num{width:66px;padding:0 6px;text-align:right}
#ctx input[type=color]{width:40px;padding:3px;cursor:pointer}
#ctx input.rng{width:120px;padding:0;border:none;accent-color:#D98A1E;background:none}
#ctx .unit{flex:none;font-size:12px;color:var(--muted);margin:0 4px 0 -2px}
.tool .fi{width:34px;height:24px;overflow:visible}
#ctx .lb{flex:none;font-size:12px;color:var(--muted)}
#ctx .area{flex:none;font-size:14px;font-weight:700;white-space:nowrap;padding:0 4px}
#ctx .area small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
#ctx .sw{flex:none}
#tray{flex:none;display:flex;gap:5px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--tray);border-top:1px solid var(--line);scrollbar-width:none}
.tool{flex:none;width:70px;height:62px;border:1px solid #E6E8EB;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:11px;color:var(--ink);cursor:pointer;padding:0}
.tool.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tool svg{width:22px;height:22px}
.sw{width:26px;height:18px;border:1.5px solid var(--ink);border-radius:2px}
.sep{flex:none;width:1px;background:#D6D9DD;margin:8px 4px}
#menu{position:absolute;top:calc(50px + env(safe-area-inset-top));right:8px;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 10px 30px rgba(38,48,59,.14);padding:6px;display:none;z-index:20;min-width:210px}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;padding:12px;border:none;background:none;font:inherit;font-size:14px;border-radius:8px;color:var(--ink);cursor:pointer}
#menu button:active{background:#EEF0F2}
#menu button.danger{color:var(--red)}
#menu hr{border:none;border-top:1px solid var(--line);margin:4px 6px}
#toast{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.pill{width:auto;height:32px;padding:0 11px;margin:0 4px;border:1.5px solid var(--ink);border-radius:8px;font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em}
body.is3d .pill{background:var(--ink);color:#fff}
#view3d{position:absolute;inset:0;display:none;background:linear-gradient(#F7F8F6,#ECEEEA);touch-action:none;z-index:5}
#view3d canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#view3d canvas:active{cursor:grabbing}
#joy{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid rgba(38,48,59,.35);display:none;touch-action:none;z-index:2}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--ink);opacity:.8;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1.5px rgba(38,48,59,.5);pointer-events:none;display:none}
body.walk #joy,body.walk #cross{display:block}
body.walk #bar3d [data-v="reset"],body.walk #bar3d [data-v="top"],body.walk #bar3d [data-v="spin"]{display:none}
#sunPanel{position:absolute;left:10px;right:10px;top:48px;max-width:520px;margin:0 auto;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:none;z-index:3;touch-action:auto;box-shadow:0 6px 20px rgba(38,48,59,.12);font-size:12px}
#sunPanel.open{display:block}
#lightPop{position:absolute;width:300px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:none;z-index:4;touch-action:auto;box-shadow:0 8px 24px rgba(38,48,59,.16);font-size:12px}
#lightPop.open{display:block}
#lightPop .row{display:flex;align-items:center;gap:6px;margin:5px 0;flex-wrap:wrap}
#lightPop .chip{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
#lightPop .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
#lightPop input[type=range]{flex:1;min-width:100px;accent-color:#D98A1E}
#sunPanel .minirow{display:none}
#sunPanel.mini{left:auto;right:10px;max-width:none;padding:6px 8px;border-radius:999px}
#sunPanel.mini .row{display:none}
#sunPanel.mini .minirow{display:flex;margin:0;flex-wrap:nowrap}
#sunPanel .minirow #sunTime2{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-width:48px}
#sunPanel .minirow button.play{width:34px;height:30px;border:none;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;cursor:pointer}
#sunPanel .row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}
#sunPanel .chip{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
#sunPanel .chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#sunPanel input[type=range]{flex:1;min-width:120px;accent-color:#D98A1E}
#sunPanel select{height:32px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;background:#fff;color:var(--ink);padding:0 6px}
#sunTime{font-size:20px;font-weight:700;min-width:62px;font-variant-numeric:tabular-nums}
#sunInfo{color:var(--muted)}
#sunPlay{width:40px;height:32px;border:none;border-radius:8px;background:var(--ink);color:#fff;font-size:14px;cursor:pointer}
body.viewer #btnUndo,body.viewer #btnRedo,body.viewer #btnFit,body.viewer .vr,body.viewer #btn3d,body.viewer #btnMenu,
body.viewer #bar3d [data-v="exit"],body.viewer #bar3d [data-v="finish"],body.viewer #ctx,body.viewer #tray{display:none!important}
body.viewer .brand{pointer-events:none}
body.viewer .brand>svg:last-child{display:none}
body.viewer #stage>svg#board{pointer-events:none}
#compass{position:absolute;right:12px;top:52px;width:40px;height:40px;pointer-events:none;opacity:.85}
body.is3d #compass{display:none}
#hint3d{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap}
#bar3d{flex:none;display:none;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar3d::-webkit-scrollbar{display:none}
#bar3d button{flex:none;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px}
body.is3d #view3d{display:block}
body.is3d #bar3d{display:flex}
body.is3d #ctx,body.is3d #tray,body.is3d #zoom,body.is3d #scale,body.is3d #hint,body.is3d #btnUndo,body.is3d #btnRedo,body.is3d #btnFit,body.is3d .vr{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="brand" id="btnPlans" aria-label="保存した間取りを開く" title="保存した間取り">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#26303B" stroke-width="1.6"><rect x="2" y="2" width="18" height="18"/><path d="M2 11h9V2M11 11v9M15 11h5"/></svg>
      <span class="pn"><span id="planName">間取りスケッチ</span><span id="saveState">読み込み中…</span></span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#6B7480" stroke-width="1.6" stroke-linecap="round" style="flex:none"><path d="M3 5l4 4 4-4"/></svg>
    </button>
    <div class="hb">
      <button class="ib" id="btnUndo" aria-label="元に戻す" title="元に戻す"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="ib" id="btnRedo" aria-label="やり直す" title="やり直す"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <span class="vr"></span>
      <button class="ib" id="btnFit" aria-label="全体を表示" title="全体を表示"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="ib pill" id="btn3d" aria-label="3D表示に切り替え" title="3D表示に切り替え">3D</button>
      <button class="ib" id="btnMenu" aria-label="メニュー" title="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
  </header>

  <div id="stage">
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gMinor" patternUnits="userSpaceOnUse" width="28" height="28"><path id="gMinorPath" d="M28 .5H.5V28" fill="none" stroke="#E7E9EC" stroke-width="1"/></pattern>
        <pattern id="gMajor" patternUnits="userSpaceOnUse" width="56" height="56"><path id="gMajorPath" d="M56 .5H.5V56" fill="none" stroke="#D8DCE0" stroke-width="1"/></pattern>
        <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0.18" stdDeviation="0.18" flood-color="#26303B" flood-opacity=".35"/></filter>
      </defs>
      <rect id="gridMinor" width="100%" height="100%" fill="url(#gMinor)"/>
      <rect width="100%" height="100%" fill="url(#gMajor)"/>
      <g id="world"><g id="items"></g><g id="overlay"></g></g>
    </svg>
    <div id="hint"></div>
    <div id="scale"><i id="scaleBar"></i>1マス 455mm角（8マスで1帖、16マスで1坪）</div>
    <div id="floorTabs" role="tablist" aria-label="階の切り替え"><button data-floor="1">1F</button><button data-floor="2">2F</button></div>
    <div id="zoom">
      <button class="ib" id="zOut" aria-label="縮小"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
      <span id="zoomLabel" title="100%に戻す">100%</span>
      <button class="ib" id="zIn" aria-label="拡大"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10M8 3v10"/></svg></button>
    </div>
    <div id="menu">
      <button data-m="plans">保存した間取り</button>
      <button data-m="new">新しい間取り</button>
      <button data-m="dup">今の間取りを複製</button>
      <button data-m="finish">外観・色と素材</button>
      <hr>
      <button data-m="png">画像で保存（PNG）</button>
      <button data-m="json">データを書き出す</button>
      <button data-m="viewer">3Dビューアを書き出す（HTML）</button>
      <button data-m="open">データを読み込む</button>
      <button data-m="sample">サンプル間取りを開く</button>
      <hr>
      <button data-m="clear" class="danger" id="mClear">この間取りを白紙にする</button>
    </div>
    <svg id="compass" viewBox="-20 -20 40 40"><circle r="17" fill="rgba(255,255,255,.9)" stroke="#D5D9DE"/><g id="compassN"><path d="M0-13L5 2H-5z" fill="#D2402D"/><path d="M0 13L5 2H-5z" fill="#9AA1A8"/><text y="-5" text-anchor="middle" font-size="7" fill="#fff" font-weight="700" font-family="sans-serif" dy="-1">N</text></g></svg>
    <div id="view3d"><div id="hint3d"></div>
      <div id="lightPop" role="dialog" aria-label="ライトの調整">
        <div class="row"><b id="lpName"></b><span id="lpRoom" style="color:var(--muted)"></span><span style="flex:1"></span><button class="chip" id="lpClose" aria-label="閉じる">×</button></div>
        <div class="row"><button class="chip" id="lpOn"></button></div>
        <div class="row"><span>白さ</span><input type="range" id="lpK" min="2200" max="6500" step="100" aria-label="色温度"><span id="lpKL" style="min-width:92px"></span></div>
        <div class="row" id="lpPresets"></div>
        <div class="row"><span>明るさ</span><input type="range" id="lpDim" min="5" max="100" step="5" aria-label="明るさ"><span id="lpDimL" style="min-width:40px"></span></div>
      </div>
      <div id="sunPanel" aria-label="太陽の動き">
        <div class="row"><b>太陽の動き</b><span style="flex:1"></span>

function porchStepSides(it){

function handlesFor(it){
  const H = [];

  if(it.kind === 'eline') return it.pts.map((p, i) => ({kind:'vertex', i, x:p[0], y:p[1]}));
  if(it.kind === 'poly' || it.kind === 'land' || it.kind === 'ext'){
    it.pts.forEach((p,i) => H.push({kind:'vertex', i, x:p[0], y:p[1]}));
    it.pts.forEach((p,i) => {
      const q = it.pts[(i+1)%it.pts.length];
      if(Math.hypot(q[0]-p[0], q[1]-p[1])*view.s > 40) H.push({kind:'mid', i, x:(p[0]+q[0])/2, y:(p[1]+q[1])/2});

    if(d === 'e' || d === 'w'){ if(b.h*view.s < 48) continue; }

  }

    if(it.kind === 'rect'){ if(w.x>=it.x && w.x<=it.x+it.w && w.y>=it.y && w.y<=it.y+it.h) return it; }
    else if(it.kind === 'stroke'){
      const tol = 12/view.s;
      for(let k=0; k<it.pts.length-1; k++) if(distSeg([w.x,w.y], it.pts[k], it.pts[k+1]) < tol) return it;
    } else if(inPoly(w, it.pts)) return it;

/* 延床（マス数）：部屋どうしの重なりを二重に数えないよう、全部の部屋を合わせた形の面積を求める。
   1マスを4×4に分けた点のうち、どこかの部屋に入っている点を数える（方眼に沿った部屋なら誤差なし） */
let areaCache = {};
function totalCells(fl0){
  if(fl0 == null) return totalCells(1) + totalCells(2);
  const polys = items.filter(i => isRoomKind(i) && i.type !== 'porch' && i.type !== 'void' && flr(i) === fl0).map(ptsOf).filter(P => P.length >= 3);
  const key = fl0 + JSON.stringify(polys);
  if(!areaCache[fl0]) areaCache[fl0] = {key:'', val:0};
  if(key === areaCache[fl0].key) return areaCache[fl0].val;
  let val = 0;
  if(polys.length){
    const bbs = polys.map(P => { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for(const [x, y] of P){ a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); } return [a, b, c, d]; });
    const X0 = Math.floor(Math.min(...bbs.map(q => q[0]))), Y0 = Math.floor(Math.min(...bbs.map(q => q[1])));
    const X1 = Math.ceil(Math.max(...bbs.map(q => q[2]))), Y1 = Math.ceil(Math.max(...bbs.map(q => q[3])));
    const R = 4; let cnt = 0;
    for(let iy = 0; iy < (Y1 - Y0)*R; iy++){
      const y = Y0 + (iy + .5)/R;
      for(let ix = 0; ix < (X1 - X0)*R; ix++){
        const x = X0 + (ix + .5)/R, p = {x, y};
        for(let k=0; k<polys.length; k++){ const q = bbs[k]; if(x < q[0] || x > q[2] || y < q[1] || y > q[3]) continue; if(inPoly(p, polys[k])){ cnt++; break; } }
      }
    }
    val = cnt/(R*R);
  }
  areaCache[fl0] = {key, val};
  return val;
}

  cancelSingleGesture();

function updatePinch(){
  const g = gesture, [a,b] = [...pointers.values()];
  const d = Math.hypot(a.x-b.x,a.y-b.y), m = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  const r = svg.getBoundingClientRect();
  const wx = (g.m0.x-r.left-g.v0.ox)/g.v0.s, wy = (g.m0.y-r.top-g.v0.oy)/g.v0.s;

svg.addEventListener('pointerdown', e => {
  e.preventDefault();
  $('menu').classList.remove('open');
  if(document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 2){ startPinch(); return; }
  if(pointers.size > 2) return;
  if(gesture && gesture.type === 'none') gesture = null;

  const w = toWorld(e.clientX, e.clientY);
  const start = {cx:e.clientX, cy:e.clientY, w};

  if(tool === 'select'){
    const sel = getSel();
    if(sel){
      const h = hitHandle(sel, w);
      if(h){
        const before = snapshot(); pushHistory(before);
        if(h.kind === 'mid'){ sel.pts.splice(h.i+1, 0, [h.x,h.y]); gesture = {type:'vertex', id:sel.id, i:h.i+1, before, start}; }
        else if(h.kind === 'vertex') gesture = {type:'vertex', id:sel.id, i:h.i, before, start};
        else gesture = {type:'resize', id:sel.id, dir:h.dir, orig:clone(sel), before, start};
        gesture.last = {x:e.clientX, y:e.clientY};
        startAutoPan(); scheduleRender(); return;
      }
    }
    const hit = hitItem(w);
    if(hit){
      if(e.pointerType === 'mouse' && hit.id === selId){ beginMove(hit, start); return; }
      const g = {type:'press', hitId:hit.id, start, ox:view.ox, oy:view.oy};
      g.timer = setTimeout(() => { if(gesture === g){ const it = getItem(g.hitId); if(it) beginMove(it, g.start); } }, 380);
      gesture = g; return;
    }
    gesture = {type:'pan', start, ox:view.ox, oy:view.oy, tapEmpty:true};
    return;
  }
  if(tool === 'roofdraw'){ gesture = {type:'place', roof:true, start, sx:snap(w.x), sy:snap(w.y), cur:[snap(w.x),snap(w.y)]}; return; }
  if(tool === 'rect'){ gesture = {type:'place', start, sx:snap(w.x), sy:snap(w.y), cur:[snap(w.x),snap(w.y)]}; return; }
  if(tool === 'poly' || tool === 'land'){ gesture = {type:'polytap', start, ox:view.ox, oy:view.oy}; return; }
  if(tool === 'extarea' || tool === 'eline'){ gesture = {type:tool === 'extarea' ? 'eplace' : 'edraw', start, a:[q100(w.x), q100(w.y)], cur:null}; return; }
  if(tool === 'furn'){ gesture = {type:'ftap', start, ox:view.ox, oy:view.oy}; return; }
  if(tool === 'pen'){ gesture = {type:'pen', pts:[[w.x,w.y]], start}; scheduleRender(); }
  if(tool === 'door'){
    const fx = Math.abs(w.x - Math.round(w.x)), fy = Math.abs(w.y - Math.round(w.y));
    // 近くに実際の壁がある線を優先する
    const wallOn = (d, c, at) => {
      const k = Math.floor(at);
      return items.some(it => {
        if(!(it.kind === 'rect' || it.kind === 'poly') || it.type === 'porch' || !onCur(it)) return false;
        const P = ptsOf(it);
        return P.some((p0, i) => { const p1 = P[(i+1) % P.length];
          return d === 'h' ? (p0[1] === c && p1[1] === c && Math.min(p0[0], p1[0]) <= k && Math.max(p0[0], p1[0]) >= k + 1)

    const c = dir === 'h' ? rc(w.y) : rc(w.x);

    const a0 = dir === 'h' ? w.x : w.y;

});
function doorFromGesture(g){
  const tap = Math.abs(g.cur - g.a0) < 0.6;

  let s0, len;
  if(tap){ len = defMM/MM; s0 = q100(g.a0 - len/2); }
  else { s0 = q100(Math.min(g.a0, g.cur)); len = Math.max(200/MM, q100(Math.max(g.a0, g.cur)) - s0); }
  const d = {id:uid(), kind:'door', dtype:doorType, dir:g.dir, x:g.dir==='h'?s0:g.c, y:g.dir==='h'?g.c:s0, len, side:g.side, hinge:0};
  if(doorType === 'win'){ const w = winOf(winType); Object.assign(d, {wtype:w.id, sill:w.sill, wh:w.h, deco:w.deco}); }

}
function onBoundary(p, it){
  if(it.kind === 'stroke' || it.kind === 'door') return false;
  const P = ptsOf(it);
  for(let i=0; i<P.length; i++) if(distSeg(p, P[i], P[(i+1)%P.length]) < 1e-6) return true;
  return false;
}

function beginMove(it, start){
  selId = it.id;
  const before = snapshot(); pushHistory(before);
  const p = [...pointers.values()][0];
  const isRoom = it.kind === 'rect' || it.kind === 'poly' || it.kind === 'free';
  const att = !isRoom ? [] : items.filter(d => flr(d) === flr(it)).filter(d => (d.kind === 'door' && ptsOf(d).every(p => onBoundary(p, it)))
    || (d.kind === 'furn' && (() => { const b = bbox(d); return inPoly({x:b.x+b.w/2, y:b.y+b.h/2}, ptsOf(it)); })())).map(d => clone(d));
  gesture = {type:'move', id:it.id, att, w0:start.w, orig:clone(it), before, start, moved:false, last:p ? {x:p.x, y:p.y} : {x:start.cx, y:start.cy}};
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){}
  applyDrag(gesture); startAutoPan();
}

window.addEventListener('pointermove', e => {
  if(!pointers.has(e.pointerId)){
    if((tool === 'poly' || tool === 'land') && poly && e.pointerType === 'mouse' && e.target.closest && e.target.closest('#board')){
      const w = toWorld(e.clientX, e.clientY), snp = tool === 'land' ? q100 : snap; hoverPt = [snp(w.x), snp(w.y)]; scheduleRender();
    }
    return;
  }
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const g = gesture; if(!g) return;
  if(g.type === 'pinch'){ if(pointers.size === 2) updatePinch(); return; }
  if(g.type === 'none') return;
  const dx = e.clientX - g.start.cx, dy = e.clientY - g.start.cy, dist = Math.hypot(dx,dy);
  const w = toWorld(e.clientX, e.clientY);
  switch(g.type){
    case 'press':
      if(dist > 12){ clearTimeout(g.timer); gesture = {type:'pan', start:g.start, ox:g.ox, oy:g.oy}; view.ox = g.ox+dx; view.oy = g.oy+dy; scheduleRender(); }
      break;
    case 'pan':
      if(dist > 6) g.tapEmpty = false;
      view.ox = g.ox+dx; view.oy = g.oy+dy; scheduleRender(); break;
    case 'eplace': case 'edraw':
      if(dist > 8) g.dragging = true;
      g.cur = [q100(w.x), q100(w.y)]; scheduleRender(); break;
    case 'polytap': case 'ftap':
      if(dist > 8) g.panning = true;
      if(g.panning){ view.ox = g.ox+dx; view.oy = g.oy+dy; scheduleRender(); }
      break;
    case 'move': case 'resize': case 'vertex':
      if(dist > 4) g.moved = true;
      g.last = {x:e.clientX, y:e.clientY};
      applyDrag(g); break;
    case 'place':
      if(dist > 8) g.dragging = true;
      g.cur = [snap(w.x), snap(w.y)]; scheduleRender(); break;
    case 'door':
      // ドラッグした向きで縦横を決める（最初に大きく動いた方向）
      if(!g.locked && dist > 12){
        g.locked = true;
        const nd = Math.abs(dx) >= Math.abs(dy) ? 'h' : 'v';
        if(nd !== g.dir){
          const w0 = g.start.w; g.dir = nd;
          const rc = doorType === 'wall' ? q100 : Math.round;
          g.c = nd === 'h' ? rc(w0.y) : rc(w0.x);
          g.a0 = nd === 'h' ? w0.x : w0.y;
          g.side = ((nd === 'h' ? w0.y : w0.x) - g.c) >= 0 ? 1 : -1;
        }
      }
      g.cur = g.dir === 'h' ? w.x : w.y; scheduleRender(); break;
    case 'pen': {
      const l = g.pts[g.pts.length-1];
      if(Math.hypot(w.x-l[0], w.y-l[1]) > 2/view.s){ g.pts.push([w.x,w.y]); scheduleRender(); }
      break;
    }
  }
});

function doResize(g, w){
  const o = g.orig, d = g.dir;
  if(o.kind === 'furn'){
    const b = bbox(o), nx = q50(w.x), ny = q50(w.y), mn = 50/MM;
    let x1 = b.x, y1 = b.y, x2 = b.x+b.w, y2 = b.y+b.h;
    if(d.includes('w')) x1 = Math.min(nx, x2-mn);
    if(d.includes('e')) x2 = Math.max(nx, x1+mn);
    if(d.includes('n')) y1 = Math.min(ny, y2-mn);
    if(d.includes('s')) y2 = Math.max(ny, y1+mn);
    const FW = Math.round((x2-x1)*MM/50)*50, FD = Math.round((y2-y1)*MM/50)*50;
    const n = {...o, x:x1, y:y1};
    if((o.rot||0) % 180){ n.fw = FD; n.fd = FW; } else { n.fw = FW; n.fd = FD; }
    replaceItem(n); return;
  }
  if(o.kind === 'door'){
    const v = q100(o.dir === 'h' ? w.x : w.y), s0 = o.dir === 'h' ? o.x : o.y, e0 = s0 + o.len, mn = 200/MM;
    const n = clone(o);
    if(d === 'a'){ const ns = Math.min(v, e0 - mn); if(o.dir === 'h') n.x = ns; else n.y = ns; n.len = e0 - ns; }
    else n.len = Math.max(mn, v - s0);
    replaceItem(n); return;
  }
  if(o.kind === 'rect' || o.kind === 'roof'){
    const nx = snap(w.x), ny = snap(w.y);
    let x1 = o.x, y1 = o.y, x2 = o.x+o.w, y2 = o.y+o.h;
    if(d.includes('w')) x1 = Math.min(nx, x2-1);
    if(d.includes('e')) x2 = Math.max(nx, x1+1);
    if(d.includes('n')) y1 = Math.min(ny, y2-1);
    if(d.includes('s')) y2 = Math.max(ny, y1+1);
    replaceItem({...o, x:x1, y:y1, w:x2-x1, h:y2-y1}); return;
  }
  const b = bbox(o), q = v => Math.round(v*2)/2, nx = q(w.x), ny = q(w.y);
  let x1 = b.x, y1 = b.y, x2 = b.x+b.w, y2 = b.y+b.h;
  if(b.w > .01){ if(d.includes('w')) x1 = Math.min(nx, x2-.5); if(d.includes('e')) x2 = Math.max(nx, x1+.5); }
  if(b.h > .01){ if(d.includes('n')) y1 = Math.min(ny, y2-.5); if(d.includes('s')) y2 = Math.max(ny, y1+.5); }
  const n = clone(o);
  n.pts = o.pts.map(([x,y]) => [
    b.w > .01 ? x1 + (x-b.x)/b.w*(x2-x1) : x,
    b.h > .01 ? y1 + (y-b.y)/b.h*(y2-y1) : y
  ]);
  replaceItem(n);
}

function applyDrag(g){
  const w = toWorld(g.last.x, g.last.y);
  if(g.type === 'move'){
    const o = g.orig;
    const wallEl = o.kind === 'door' && o.dtype === 'wall';
    const snx = o.kind === 'furn' ? q50 : (wallEl || o.kind === 'land' || o.kind === 'ext' || o.kind === 'eline' || (o.kind === 'door' && o.dir === 'h')) ? q100 : snap;
    const sny = o.kind === 'furn' ? q50 : (wallEl || o.kind === 'land' || o.kind === 'ext' || o.kind === 'eline' || (o.kind === 'door' && o.dir === 'v')) ? q100 : snap;
    const dx = snx(w.x-g.w0.x), dy = sny(w.y-g.w0.y);
    replaceItem(translateItem(g.orig, dx, dy));
    for(const d of g.att || []) replaceItem(translateItem(d, dx, dy));
  }
  else if(g.type === 'resize') doResize(g, w);
  else if(g.type === 'vertex'){ if(!g.moved) return; const it = getItem(g.id); if(it) it.pts[g.i] = (it.kind === 'land' || it.kind === 'ext' || it.kind === 'eline') ? [q100(w.x), q100(w.y)] : [snap(w.x), snap(w.y)]; }
  scheduleRender();
}

/* 移動・変形中に指が画面の端へ来たら、自動で画面を送る */
let autoRaf = 0;
function startAutoPan(){ if(!autoRaf) autoRaf = requestAnimationFrame(autoPanTick); }
function autoPanTick(){
  autoRaf = 0;
  const g = gesture;
  if(!g || !['move','resize','vertex'].includes(g.type) || !g.last) return;
  const r = svg.getBoundingClientRect(), E = 56, V = 9;
  const f = d => clamp(1 - d/E, 0, 1);
  let vx = 0, vy = 0;
  if(g.last.x < r.left + E) vx = V*f(g.last.x - r.left);
  else if(g.last.x > r.right - E) vx = -V*f(r.right - g.last.x);
  if(g.last.y < r.top + E) vy = V*f(g.last.y - r.top);
  else if(g.last.y > r.bottom - E) vy = -V*f(r.bottom - g.last.y);
  if(vx || vy){ view.ox += vx; view.oy += vy; applyDrag(g); }
  autoRaf = requestAnimationFrame(autoPanTick);
}

/* ブラウザ側のスワイプ（引っ張って更新・画面を閉じる等）を方眼上では止める */
const blockTouch = e => { if(e.cancelable) e.preventDefault(); };
svg.addEventListener('touchstart', blockTouch, {passive:false});
svg.addEventListener('touchmove', blockTouch, {passive:false});
document.addEventListener('touchmove', e => { if(gesture && e.cancelable) e.preventDefault(); }, {passive:false});

function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  const g = gesture; if(!g) return;
  if(g.type === 'pinch'){ gesture = pointers.size ? {type:'none'} : null; scheduleRender(); return; }
  if(g.type === 'none'){ if(!pointers.size) gesture = null; return; }
  gesture = null; clearTimeout(g.timer);
  const cancelled = e.type === 'pointercancel';
  switch(g.type){
    case 'press': if(!cancelled) selId = g.hitId; break;
    case 'pan': if(g.tapEmpty && !cancelled) selId = null; break;
    case 'move': case 'resize':
      if(snapshot() === g.before) undoStack.pop();
      break;
    case 'vertex': {
      const it = getItem(g.id);
      if(!g.moved || !it){ items = JSON.parse(g.before); undoStack.pop(); break; }
      const p = it.pts.filter((q,i,arr) => { const n = arr[(i+1)%arr.length]; return !(q[0] === n[0] && q[1] === n[1]); });
      if(p.length < 3){ items = JSON.parse(g.before); undoStack.pop(); break; }
      it.pts = p;
      if(snapshot() === g.before) undoStack.pop();
      break;
    }
    case 'place': {
      if(cancelled) break;
      if(g.roof){
        let rr;
        if(g.dragging) rr = placeRect(g);
        else {
          const w0 = g.start.w, room = items.slice().reverse().find(i => (i.kind === 'rect' || i.kind === 'poly' || i.kind === 'free') && i.type !== 'porch' && onCur(i) && inPoly(w0, ptsOf(i)));
          if(room){ const bb = bbox(room); rr = {x:Math.floor(bb.x), y:Math.floor(bb.y), w:Math.ceil(bb.x + bb.w) - Math.floor(bb.x), h:Math.ceil(bb.y + bb.h) - Math.floor(bb.y)}; }
          else rr = {x:snap(w0.x - 4), y:snap(w0.y - 4), w:8, h:8};
        }
        pushHistory(); const n = newRoof(rr.x, rr.y, rr.w, rr.h); items.push(n); setTool('select'); selId = n.id; break;
      }
      const t = typeOf(placeType);
      const r = g.dragging ? placeRect(g) : {x:snap(g.start.w.x - t.w/2), y:snap(g.start.w.y - t.h/2), w:t.w, h:t.h};
      pushHistory();
      const n = {id:uid(), kind:'rect', type:placeType, label:'', ...r};
      items.push(n); setTool('select'); selId = n.id; break;
    }
    case 'polytap': {
      if(g.panning || cancelled) break;
      const snp = tool === 'land' ? q100 : snap;
      const p = [snp(g.start.w.x), snp(g.start.w.y)];
      if(!poly) poly = {pts:[]};
      const f = poly.pts[0], l = poly.pts[poly.pts.length-1];
      if(poly.pts.length >= 3 && Math.abs(f[0] - p[0]) < 1e-6 && Math.abs(f[1] - p[1]) < 1e-6){ closePoly(); break; }
      if(!l || l[0] !== p[0] || l[1] !== p[1]) poly.pts.push(p);
      break;
    }
    case 'pen': if(!cancelled) finishPen(g); break;
    case 'eplace': {
      if(cancelled) break;
      const t = extOf(extType); let x0, y0, x1, y1;
      if(g.dragging && g.cur){ x0 = Math.min(g.a[0], g.cur[0]); x1 = Math.max(g.a[0], g.cur[0]); y0 = Math.min(g.a[1], g.cur[1]); y1 = Math.max(g.a[1], g.cur[1]); }
      else { const W2 = t.w/MM, D2 = t.d/MM; x0 = q100(g.a[0] - W2/2); y0 = q100(g.a[1] - D2/2); x1 = x0 + W2; y1 = y0 + D2; }
      if(x1 - x0 < 300/MM) x1 = x0 + 300/MM; if(y1 - y0 < 300/MM) y1 = y0 + 300/MM;
      pushHistory(); const n = {id:uid(), kind:'ext', etype:extType, pts:[[x0,y0],[x1,y0],[x1,y1],[x0,y1]]};
      items.unshift(n); setTool('select'); selId = n.id; break;
    }
    case 'edraw': {
      if(cancelled) break;
      const t = elOf(elType); let a = g.a, b2 = g.cur;
      if(!g.dragging || !b2 || Math.hypot(b2[0]-a[0], b2[1]-a[1]) < 200/MM){ const L2 = t.len/MM; a = [q100(g.a[0] - L2/2), g.a[1]]; b2 = [a[0] + L2, a[1]]; }
      pushHistory(); const n = {id:uid(), kind:'eline', etype:elType, pts:[a, b2]};
      if(elType === 'fence') Object.assign(n, {style:'slat', h:1200});
      items.push(n); setTool('select'); selId = n.id; break;
    }
    case 'ftap': {
      if(g.panning || cancelled) break;
      const t = furnOf(furnType), W = t.w/MM, D = t.d/MM;
      pushHistory();
      const n = {id:uid(), kind:'furn', ftype:t.id, x:q50(g.start.w.x - W/2), y:q50(g.start.w.y - D/2), fw:t.w, fd:t.d, fh:t.h, rot:0};
      if(t.light) Object.assign(n, {temp:'warm', power:3, on:true});
      if(t.mh != null) n.mh = t.mh;
      items.push(n); setTool('select'); selId = n.id; break;
    }
    case 'door': {
      if(cancelled) break;
      pushHistory();
      const n = doorFromGesture(g); items.push(n); setTool('select'); selId = n.id; break;
    }
  }
  scheduleRender();
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);

function finishPen(g){
  let pts = g.pts; if(pts.length < 2) return;
  let len = 0; for(let i=1; i<pts.length; i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
  if(len < .3) return;
  const f = pts[0], l = pts[pts.length-1];
  let closed = pts.length > 6 && len > 2 && Math.hypot(f[0]-l[0], f[1]-l[1]) < Math.max(.6, 20/view.s);
  pts = rdp(pts, .03).map(p => [+p[0].toFixed(3), +p[1].toFixed(3)]);
  if(closed){
    const a = pts[0], b = pts[pts.length-1];
    if(pts.length > 3 && Math.hypot(a[0]-b[0], a[1]-b[1]) < .35) pts.pop();
    if(pts.length < 3) closed = false;
  }
  pushHistory();
  items.push(closed ? {id:uid(), kind:'free', type:shapeType, label:'', pts} : {id:uid(), kind:'stroke', type:'other', pts});
}

svg.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
svg.addEventListener('wheel', e => {
  e.preventDefault();
  if(e.ctrlKey || e.metaKey){
    const r = svg.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
    zoomAt(mx, my, Math.exp(-e.deltaY*0.01));
  } else { view.ox -= e.deltaX; view.oy -= e.deltaY; scheduleRender(); }
}, {passive:false});

function zoomAt(mx, my, f){
  const s = clamp(view.s*f, 6, 140), wx = (mx-view.ox)/view.s, wy = (my-view.oy)/view.s;
  view = {s, ox:mx-wx*s, oy:my-wy*s}; scheduleRender();
}

function allBBox(){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const it of items){ const q = bbox(it); a=Math.min(a,q.x); b=Math.min(b,q.y); c=Math.max(c,q.x+q.w); d=Math.max(d,q.y+q.h); }
  return {x:a, y:b, w:c-a, h:d-b};
}
function fitView(){
  const r = svg.getBoundingClientRect();
  if(!items.length){ view = {s:BASE_S, ox:24, oy:24}; scheduleRender(); return; }
  const b = allBBox(), pad = 56;
  const s = clamp(Math.min((r.width-pad*2)/Math.max(b.w,1), (r.height-pad*2)/Math.max(b.h,1)), 8, 80);
  view = {s, ox:r.width/2-(b.x+b.w/2)*s, oy:r.height/2-(b.y+b.h/2)*s};
  scheduleRender();
}
$('btnFit').onclick = fitView;

  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'select') return;
  if(!$('sheet').hidden){ if(e.key === 'Escape') closeSheet(); return; }
  if(!$('finish').hidden){ if(e.key === 'Escape') $('finish').hidden = true; return; }
  if(mode3d){ if(e.key === 'Escape') exit3D(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if(e.key === 'Escape'){ if(poly) poly = null; else if(tool !== 'select') setTool('select'); else selId = null; scheduleRender(); return; }
  if(e.key === 'Enter' && tool === 'poly'){ closePoly(); return; }
  const sel = getSel(); if(!sel) return;
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); act('del'); return; }
  const arrows = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if(arrows[e.key]){ e.preventDefault(); pushHistory(); const [ax, ay] = arrows[e.key];
    const wallEl = sel.kind === 'door' && sel.dtype === 'wall';
    const stx = sel.kind === 'furn' ? 50/MM : (wallEl || (sel.kind === 'door' && sel.dir === 'h')) ? 100/MM : 1;
    const sty = sel.kind === 'furn' ? 50/MM : (wallEl || (sel.kind === 'door' && sel.dir === 'v')) ? 100/MM : 1;
    replaceItem(translateItem(sel, ax*stx, ay*sty)); scheduleRender(); }
});

function exportPNG(){
  if(!items.length){ toast('まだ何も描かれていません'); return; }
  const b = allBBox(), S = 26, vx = Math.floor(b.x)-1, vy = Math.floor(b.y)-1, vw = Math.ceil(b.w)+2, vh = Math.ceil(b.h)+2;
  const W = vw*S, H = vh*S;
  const str = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${vx} ${vy} ${vw} ${vh}">`
    + `<defs><pattern id="g" patternUnits="userSpaceOnUse" width="1" height="1"><path d="M1 0H0V1" fill="none" stroke="#E4E6E9" stroke-width="0.025"/></pattern></defs>`
    + `<rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="#fff"/><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="url(#g)"/>`
    + sceneSVG(1/S, null, 'cutX') + `</svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, 0, 0);
    c.toBlob(bl => bl ? download(bl, fileBase() + '.png') : toast('画像を作れませんでした'), 'image/png');
  };
  img.onerror = () => toast('画像を作れませんでした');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);

/* 旧データ（1マス910mm）を新しいマス（455mm）に変換 */
function upgradeV1(arr){
  if(!Array.isArray(arr)) return arr;
  return arr.map(it => {
    const n = clone(it);
    if(n.kind === 'rect'){ n.x*=2; n.y*=2; n.w*=2; n.h*=2; }
    else if(n.kind === 'door'){ n.x*=2; n.y*=2; n.len*=2; }
    else if(n.pts) n.pts = n.pts.map(p => [p[0]*2, p[1]*2]);
    return n;
  });
}

const IDX = 'madori:index', CURK = 'madori:current', PK = id => 'madori:plan:' + id;
const memStore = {};
const store = (() => {
  let ls = null;
  try{ const t = '__madori_test'; window.localStorage.setItem(t, '1'); window.localStorage.removeItem(t); ls = window.localStorage; }catch(_){}
  const cs = !ls && window.storage ? window.storage : null;
  return {
    kind: ls ? 'device' : cs ? 'claude' : 'none',
    async get(k){
      try{
        if(ls) return ls.getItem(k);
        if(cs){ const r = await cs.get(k, false); return r ? r.value : null; }
      }catch(_){ return null; }
      return memStore[k] ?? null;
    },
    async set(k, v){
      if(ls){ ls.setItem(k, v); return; }
      if(cs){ const r = await cs.set(k, v, false); if(!r) throw new Error('save failed'); return; }
      memStore[k] = v;
    },
    async del(k){ try{ if(ls) ls.removeItem(k); else if(cs) await cs.delete(k, false); else delete memStore[k]; }catch(_){} }
  };
})();

async function flushSave(){

  const s = saveKey(); if(s === lastSaved) return;
  try{
    await store.set(PK(cur.id), JSON.stringify({v:2, items, settings}));

    if(p){ p.updated = Date.now(); p.tsubo = totalCells()*TSUBO; p.name = cur.name; }
    await store.set(IDX, JSON.stringify(plans));
    lastSaved = s; setSaveState(savedLabel());
  }catch(_){
    setSaveState('保存できませんでした');
    toast('端末に保存できませんでした。「データを書き出す」でファイルに残してください');

/* 壁の線分を集める：方眼上の辺は1マスごとに分けて重複を消し、戸・通路の部分を抜いてからつなぎ直す */
function collectWalls(){
  const E = 1e-6, runs = {}, other = new Map();
  const lineKey = (dir, c) => dir + ',' + (+c).toFixed(4);
  const addRun = (dir, c, s0, e0) => { if(Math.abs(e0 - s0) < E) return; (runs[lineKey(dir, c)] = runs[lineKey(dir, c)] || []).push([Math.min(s0, e0), Math.max(s0, e0)]); };
  const add = (a, b) => {
    const [x1,y1] = a, [x2,y2] = b;
    if(Math.hypot(x2-x1, y2-y1) < E) return;
    if(Math.abs(y1 - y2) < E) return addRun('h', y1, x1, x2);
    if(Math.abs(x1 - x2) < E) return addRun('v', x1, y1, y2);
    const k = [a,b].map(p => p.map(v => v.toFixed(3)).join(',')).sort().join('|');
    other.set(k, [a,b]);
  };
  for(const it of items){
    if(it.kind === 'door' || it.kind === 'furn' || it.kind === 'roof' || it.kind === 'land' || it.kind === 'ext' || it.kind === 'eline') continue;
    if(it.kind === 'stroke'){ for(let i=1; i<it.pts.length; i++) add(it.pts[i-1], it.pts[i]); continue; }
    if(it.type === 'porch' || it.type === 'void') continue;
    const P = ptsOf(it);
    for(let i=0; i<P.length; i++) add(P[i], P[(i+1)%P.length]);
  }
  const dstart = d => d.dir === 'h' ? d.x : d.y, dline = d => d.dir === 'h' ? d.y : d.x;
  for(const d of items.filter(i => i.kind === 'door' && i.dtype === 'wall')) addRun(d.dir, dline(d), dstart(d), dstart(d) + d.len);
  const cuts = {}, accs = {};

function build3D(){

    else { const geo = new T.ShapeGeometry(shape); geo.rotateX(-Math.PI/2); mesh = new T.Mesh(geo, em); mesh.position.y = BASE + .004 + .001*eo; }

    if(e.etype === 'road'){

    const col = itemColor(e);

  R3.levelRoots = []; R3.wallsList = []; R3.labelsList = []; R3.ceilGs = []; R3.lightGs = []; R3.dayGs = []; R3.dayLights = []; R3.winList = [];
  // 階段の穴・吹き抜け（2階の床と1階の天井に開ける）

  const voidPolys = ALL.filter(i => isRoomKind(i) && i.type === 'void' && flr(i) === 2).map(ptsOf);
  const holesIn = (P, list) => list.filter(H2 => { const c = H2.reduce((a, q) => [a[0] + q[0]/H2.length, a[1] + q[1]/H2.length], [0, 0]);

  const matInt = new T.MeshStandardMaterial({color:C(settings.wall), roughness:.95});
  const matTop = new T.MeshStandardMaterial({color:C('#3A3F45'), roughness:.9});
  const extK = 'ext-' + (settings.extTex || 'tile');

  const scaleUV = (geo, L, h) => {

    const endMat = (P, j) => {

  };
  // 基礎の帯（外側の面だけ）。縮めた端は角まで回り込むように伸ばす
  const addPlinth = w => {
    if(!w || !w.out || LV !== 1) return;
    // 開口部で切れた端は伸ばさない（となりの基礎と重ならないように）
    const pA = w.cA ? 0 : (w.eA < 0 ? -w.eA : 0) + 0.025, pB = w.cB ? 0 : (w.eB < 0 ? -w.eB : 0) + 0.025;
    const fh = -BASE - 0.02, tt = w.vert ? 0.028 : 0.026, off = w.th/2 + tt/2;
    const f = new T.Mesh(new T.BoxGeometry(w.L + pA + pB, fh, tt), matBase);
    const sh = (pB - pA)/2;
    f.position.set(w.mx + w.nx*w.out*off + w.ux*sh, BASE + fh/2, w.mz + w.nz*w.out*off + w.uz*sh); f.rotation.y = w.rot; f.receiveShadow = true;
    walls.add(f);
  };
  const {segs, accentOn, accentIv} = collectWalls();
  for(const sg of segs) addPlinth(addWall(sg.a, sg.b, B0, H, sg.acc, sg));
  const dLine = d => d.dir === 'h' ? d.y : d.x, dStart = d => d.dir === 'h' ? d.x : d.y;
  const accOf = d => accentOn(d.dir, dLine(d), dStart(d), dStart(d) + d.len);

  const mat3 = hex => new T.MeshStandardMaterial({color:C(hex), roughness:.8});
  const mkMesh = (geo, mat, x, y, z, parent = walls) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
  const metal = new T.MeshStandardMaterial({color:C('#B8BEC4'), roughness:.3, metalness:.6});

  // 窓
  const winList = [];
  const frameMat = new T.MeshStandardMaterial({color:C(settings.winFrame), roughness:.5});
  const glassMat = new T.MeshStandardMaterial({color:C('#AFC6D6'), roughness:.05, metalness:.1, transparent:true, opacity:.32, depthWrite:false});
  const frostMat = new T.MeshStandardMaterial({color:C('#EEF2F4'), roughness:.95, metalness:0, transparent:true, opacity:.88});
  const shadeTex = getTex('honey', '#F3EFE6');
  const decoMat = texMat('deco', settings.deco || settings.winFrame, {roughness:.7});
  for(const d of items.filter(i => i.kind === 'door' && i.dtype === 'win')){
    const {u, P0, P1} = doorGeom(d), L = d.len*M;
    const sill = Math.min((d.sill||0)/1000, H - 0.1), top = Math.min(sill + (d.wh||1000)/1000, H);
    const acc = accOf(d);
    const lo = addWall(P0, P1, B0, Math.max(B0, sill), acc, {dir:d.dir, exact:true, collide:false});
    addPlinth(lo);
    addWall(P0, P1, top, H, acc, {dir:d.dir, exact:true, collide:false});
    R3.colliders.push([P0[0]*M, P0[1]*M, P1[0]*M, P1[1]*M, WALL_T/2]);
    if(top - sill < 0.05) continue;
    const g = new T.Group(), rot = Math.atan2(-u[1], u[0]);
    const mx = (P0[0]+P1[0])/2*M, mz = (P0[1]+P1[1])/2*M;
    g.position.set(mx, 0, mz); g.rotation.y = rot; walls.add(g);
    const wh = top - sill, fw = 0.05, fd = WALL_T*0.9;
    const box = (w, h, dd, x, y, z, mat) => mkMesh(new T.BoxGeometry(w, h, dd), mat, x, y, z, g);
    box(L, fw, fd, 0, sill + fw/2, 0, frameMat); box(L, fw, fd, 0, top - fw/2, 0, frameMat);
    box(fw, wh, fd, -L/2 + fw/2, sill + wh/2, 0, frameMat); box(fw, wh, fd, L/2 - fw/2, sill + wh/2, 0, frameMat);
    const iw = L - 2*fw, ih = wh - 2*fw, cy = sill + wh/2, gm = d.frost ? frostMat : glassMat, glasses = [];
    const sash = (x, z, w) => {
      const t = .035;
      box(w, t, .04, x, sill + fw + t/2, z, frameMat); box(w, t, .04, x, top - fw - t/2, z, frameMat);
      box(t, ih, .04, x - w/2 + t/2, cy, z, frameMat); box(t, ih, .04, x + w/2 - t/2, cy, z, frameMat);
      const gl = box(w - 2*t, ih - 2*t, .006, x, cy, z, gm); gl.castShadow = !!d.frost && (settings.frostT ?? .5) < .5; glasses.push(gl);
    };
    const wt = d.wtype || 'koshi';
    if(wt === 'hakidashi' || wt === 'koshi'){ sash(-iw/4 - .01, -.02, iw/2 + .02); sash(iw/4 + .01, .02, iw/2 + .02); }
    else if(wt === 'square'){ sash(0, 0, iw); box(.02, .12, .03, iw/2 - .08, cy, .03, metal); }
    else { const gl = box(iw, ih, .006, 0, cy, 0, gm); gl.castShadow = !!d.frost && (settings.frostT ?? .5) < .5; glasses.push(gl); if(wt === 'slit') box(.02, .1, .03, 0, sill + fw + .15, .03, metal); }
    const outDir = lo ? lo.out : (() => { const nx = Math.sin(rot), nz = Math.cos(rot); return !inside(mx + nx*.25, mz + nz*.25) ? 1 : !inside(mx - nx*.25, mz - nz*.25) ? -1 : 0; })();
    const winRec = {shade:null};
    // ハニカムシェード（かすみガラス以外。タップで開閉）
    if(!d.frost){
      const inSide = outDir ? -outDir : -1, zS = inSide*(WALL_T/2 + .03), sw = iw + .02, full = ih, minH = .05, yTop = top - fw;
      box(sw + .02, .05, .05, 0, yTop + .005, zS, mat3('#E9E5DC'));
      const sMat = new T.MeshStandardMaterial({map:shadeTex, color:0xffffff, roughness:.95, transparent:true, opacity:.94, side:T.DoubleSide});
      sMat.userData.keepMap = true;
      const geo = new T.BoxGeometry(sw, 1, .018), uv = geo.attributes.uv, tm = shadeTex.userData.meters;
      for(let i=0; i<uv.count; i++) uv.setXY(i, uv.getX(i)*sw/tm, uv.getY(i)*full/tm);
      const shade = mkMesh(geo, sMat, 0, 0, zS, g); shade.castShadow = (settings.shadeT ?? .3) < .5;
      const rail = box(sw, .025, .03, 0, 0, zS, mat3('#E9E5DC'));
      const key = 'sh:' + d.id, t0 = doorState[key] ? 1 : 0;
      const obj = {id:key, type:'shade', t:t0, target:t0, seg:null, meshes:[...glasses, shade, rail]};
      obj.apply = t => { const h = minH + (full - minH)*easeIO(t); shade.scale.y = h; shade.position.y = yTop - h/2; rail.position.y = yTop - h - .012; };

    }
    // 採光計算用に窓を記録（どの部屋に面しているか・外向きの向き・面積）
    if(outDir){
      const onx = Math.sin(rot)*outDir, onz = Math.cos(rot)*outDir;
      const room = roomAt((mx - onx*.3)/M, (mz - onz*.3)/M);
      if(room){ Object.assign(winRec, {room, nx:onx, nz:onz, area:L*(top - sill), frost:!!d.frost, x:mx - onx*.6, z:mz - onz*.6, y:(sill + top)/2}); winList.push(winRec); }
    }
    // 外側の飾りタイル（窓の上下の縦ストライプ）
    if(d.deco && outDir){
      const z = outDir*(WALL_T/2 + 0.006), dh = 0.13;
      for(const y of [top + dh/2 + .01, sill - dh/2 - .01]){
        if(y - dh/2 < 0.05 || y + dh/2 > H) continue;
        const geo = new T.BoxGeometry(L + 0.12, dh, 0.012), uv = geo.attributes.uv;
        for(let i=0; i<uv.count; i++) uv.setXY(i, uv.getX(i)*(L+.12)/0.6, uv.getY(i)*dh/0.6);
        mkMesh(geo, decoMat, 0, y, z, g);
      }
    }
  }

  // 戸（枠・取っ手付き。タップで開閉）
  const doorMatIn = new T.MeshStandardMaterial({color:C(settings.door), roughness:.6});
  const casingIn = new T.MeshStandardMaterial({color:C(settings.door), roughness:.55});
  const entryMat = new T.MeshStandardMaterial({color:C(settings.entryColor || '#4A3A33'), roughness:.5});
  for(const d of items.filter(i => i.kind === 'door' && isLeaf(i.dtype))){
    const {u, n, P0, P1} = doorGeom(d), L = d.len*M, sd = d.side || 1;
    const rot = Math.atan2(-u[1], u[0]);
    const mx = (P0[0]+P1[0])/2*M, mz = (P0[1]+P1[1])/2*M;
    const isEntry = d.dtype === 'entry', dh = Math.min(isEntry ? ENTRY_H : DOOR_H, H);
    // 戸の下端＝両側の床の低いほう（玄関の土間やポーチは床より低い）。それより下は壁でふさぐ
    const fl = (k) => floorLevelAt(mx + n[0]*k*.3, mz + n[1]*k*.3);
    const y0 = Math.max(B0, Math.min(fl(1), fl(-1)));
    if(y0 > B0 + .005) addPlinth(addWall(P0, P1, B0, y0, accOf(d), {dir:d.dir, exact:true, collide:false}));
    if(d.dtype !== 'open' && H > dh + 0.01) addWall(P0, P1, dh, H, accOf(d), {dir:d.dir, exact:true, collide:false});
    if(d.dtype === 'open') continue;
    const doorMat = isEntry ? entryMat : doorMatIn, casing = isEntry ? entryMat : casingIn;
    // 枠
    const fg = new T.Group(); fg.position.set(mx, 0, mz); fg.rotation.y = rot; walls.add(fg);
    for(const sx of [-1, 1]) mkMesh(new T.BoxGeometry(.035, dh - y0 + .035, WALL_T + .02), casing, sx*(L/2 - .0175), y0 + (dh - y0 + .035)/2, 0, fg);
    mkMesh(new T.BoxGeometry(L, .035, WALL_T + .02), casing, 0, dh + .0175, 0, fg);
    // 沓摺（戸の下の敷居）
    mkMesh(new T.BoxGeometry(L - .07, .012, WALL_T + .02), isEntry ? metal : casing, 0, y0 + .006, 0, fg);
    const t0 = doorState[d.id] ? 1 : 0;
    const obj = {id:d.id, type:d.dtype, t:t0, target:t0, L, seg:null};
    const pw = L - .07, ph = dh - y0 - .02;
    if(d.dtype === 'swing' || isEntry){
      const Hn = d.hinge ? P1 : P0, On = d.hinge ? P0 : P1;
      const hx = Hn[0]*M, hz = Hn[1]*M, ux = (On[0]-Hn[0])*M/L, uz = (On[1]-Hn[1])*M/L;
      const pivot = new T.Group(); pivot.position.set(hx, 0, hz); walls.add(pivot);
      const panel = mkMesh(new T.BoxGeometry(pw, ph, .04), doorMat, .035 + pw/2, y0 + ph/2 + .014, 0, pivot);
      if(isEntry){
        // 玄関ドア（デザインは「外観・色と素材」で選択）
        const ds = settings.entryDesign || 'slit', frost = new T.MeshStandardMaterial({color:C('#E9E7E1'), roughness:.3});
        if(ds === 'slit'){ mkMesh(new T.BoxGeometry(.1, ph*.86, .046), frost, -pw*.08, 0, 0, panel); for(let i=0; i<9; i++) mkMesh(new T.BoxGeometry(.06, .06, .05), new T.MeshStandardMaterial({color:C('#C9D3DA'), roughness:.1}), -pw*.08, -ph*.38 + i*ph*.095, 0, panel); }
        if(ds === 'glass'){ mkMesh(new T.BoxGeometry(pw*.36, ph*.62, .046), new T.MeshStandardMaterial({color:C('#9FB4C2'), roughness:.1, transparent:true, opacity:.7}), -pw*.1, ph*.08, 0, panel); }
        if(ds === 'lines'){ for(let i=0; i<7; i++) mkMesh(new T.BoxGeometry(pw*.9, .012, .046), new T.MeshStandardMaterial({color:C('#1E1A18'), roughness:.6}), 0, -ph*.4 + i*ph*.13, 0, panel); }
        for(const s2 of [-1, 1]) mkMesh(new T.BoxGeometry(.03, .6, .03), metal, pw/2 - .1, 1.0 - ph/2 + .08, s2*.045, panel);
        for(const s2 of [-1, 1]) for(const hy of [.25, 1.0, 1.75]) if(hy < ph) mkMesh(new T.BoxGeometry(.02, .1, .02), metal, -pw/2 + .01, hy - ph/2, s2*.022, panel);
      } else {
        // レバーハンドル（両面）

      };
    }
    obj.apply(obj.t);
    obj.mesh.userData.door = obj;
    R3.doors.push(obj); R3.doorMeshes.push(obj.mesh);
  }

  // 玄関ポーチの階段
  for(const it of rooms.filter(i => i.type === 'porch')){
    const rects = porchStepRects(it), n = porchSteps(it); if(!rects.length) continue;
    const lvl = PORCH_TOP, riser = (lvl - BASE)/(n + 1);
    const stepMat = texMat('tile', itemColor(it), {roughness:.85});

    for(const rc of rects){
      const k = rc.k, top = lvl - riser*k, hgt = top - BASE;
      const x = (rc.x + rc.w/2)*M, z = (rc.y + rc.h/2)*M, w = rc.w*M, dd = rc.h*M;

      const dims = [[dd, hgt], [dd, hgt], [w, dd], [w, dd], [w, hgt], [w, hgt]];      // 面ごとに実寸でタイルを貼る
      for(let fc=0; fc<6; fc++) for(let i=0; i<4; i++){ const q = fc*4 + i; uv.setXY(q, uv.getX(q)*dims[fc][0], uv.getY(q)*dims[fc][1]); }
      const st = new T.Mesh(geo, stepMat); st.position.set(x, BASE + hgt/2, z); st.castShadow = true; st.receiveShadow = true; walls.add(st);
    }
  }

  // 家具
  const lightPts = [];
  for(const f of items.filter(i => i.kind === 'furn')){
    const fb = bbox(f), fx = (fb.x + fb.w/2)*M, fz = (fb.y + fb.h/2)*M;
    const g = furn3D(T, f);
    g.rotation.y = -(f.rot||0)*Math.PI/180;
    const lift = isLight(f) && furnOf(f.ftype).ground ? (f.mh || 0)/1000 : 0;      // 屋外の照明は「置く高さ」ぶん持ち上げる
    g.position.set(fx, isLight(f) && !furnOf(f.ftype).ground ? 0 : floorLevelAt(fx, fz) + 0.003 + lift, fz);
    walls.add(g);
    if(g.userData.lightPts && g.userData.lightPts.length){
      g.updateMatrixWorld(true);
      for(const lp of g.userData.lightPts){ const v = new T.Vector3(lp.x, lp.y, lp.z).applyMatrix4(g.matrixWorld); lightPts.push({...lp, x:v.x, y:v.y, z:v.z}); }
    }
    if(g.userData.robot){
      const RB0 = g.userData.robot; g.updateMatrixWorld(true);
      const hw = new T.Vector3(0, 0, RB0.home[1]).applyMatrix4(g.matrixWorld);
      const st = roombaState[f.id] || 'dock';
      const rb = {id:f.id, robot:RB0.robot, brush:RB0.brush, home:{x:hw.x, z:hw.z}, yaw0:g.rotation.y, y:g.position.y,
        poly:(() => { const rm = roomAt(hw.x/M, hw.z/M); return rm ? ptsOf(rm) : null; })(),
        state:st === 'dock' ? 'dock' : 'clean', x:hw.x, z:hw.z, head:g.rotation.y, t:0, bumpT:0, level:LV};
      rb.robot.position.set(rb.x, rb.y, rb.z); rb.robot.rotation.y = rb.head; root.add(rb.robot);
      const tapObj = {id:'rb:' + f.id, type:'roomba', t:0, target:0, seg:null, apply(){}, meshes:[], onTap(){ toggleRoomba(rb); }};
      for(const obj of [g, rb.robot]) obj.traverse(o => { if(o.isMesh){ o.userData.door = tapObj; tapObj.meshes.push(o); } });
      R3.doors.push(tapObj); R3.doorMeshes.push(...tapObj.meshes);
      R3.roombas.push(rb);
    }
    if(g.userData.stairs){
      // 歩くとき用：階段の上では段ごとの高さに立つ
      R3.floorInfo.unshift(stairRamp(f, g.userData.stairs));
    }
    if(g.userData.posts){
      g.updateMatrixWorld(true);
      for(const [px, pz] of g.userData.posts){ const v = new T.Vector3(px, 0, pz).applyMatrix4(g.matrixWorld), t = .08; R3.colliders.push([v.x - t, v.z - t, v.x + t, v.z - t, 0], [v.x + t, v.z - t, v.x + t, v.z + t, 0], [v.x + t, v.z + t, v.x - t, v.z + t, 0], [v.x - t, v.z + t, v.x - t, v.z - t, 0]); }
    }
    if(g.userData.doorObj){ const o = g.userData.doorObj; R3.doors.push(o); R3.doorMeshes.push(...o.meshes); }
    if(furnOf(f.ftype).garden && f.ftype !== 'shrub'){ const t = .15; R3.colliders.push([fx - t, fz - t, fx + t, fz - t, 0], [fx + t, fz - t, fx + t, fz + t, 0], [fx + t, fz + t, fx - t, fz + t, 0], [fx - t, fz + t, fx - t, fz - t, 0]); }
    else if(f.fh >= 100 && f.ftype !== 'rug' && f.ftype !== 'tvwall' && f.ftype !== 'roomba' && f.ftype !== 'stairs' && !f.ftype.startsWith('carport') && !isLight(f)){
      const x1 = fb.x*M, z1 = fb.y*M, x2 = (fb.x+fb.w)*M, z2 = (fb.y+fb.h)*M;
      R3.colliders.push([x1,z1,x2,z1,0],[x2,z1,x2,z2,0],[x2,z2,x1,z2,0],[x1,z2,x1,z1,0]);
    }
  }

  // 屋根
  const roof = buildRoof(T, H, {inside, matExtA, matExtB, texM, C, texMat, accentIv});
  if(roof) walls.add(roof);

  // 天井と室内の照明（屋根を付けて歩いているときだけ表示・点灯）
  const ceilG = new T.Group(), lightG = new T.Group();
  const ceilMat = new T.MeshStandardMaterial({color:C(settings.ceil || '#F6F5F2'), roughness:.95, side:T.DoubleSide});
  for(const it of rooms){
    if(it.type === 'porch' || it.type === 'void') continue;
    const P = ptsOf(it); if(P.length < 3) continue;
    const geo = new T.ShapeGeometry(shapeWithHoles(P, LV === 1 && levels.length > 1 ? holesIn(P, stairPolys.concat(voidPolys)) : [])); geo.rotateX(-Math.PI/2);
    const cm = new T.Mesh(geo, ceilMat); cm.position.y = WALL_H - .002; cm.receiveShadow = true; ceilG.add(cm);
  }
  // 部屋を照らす光：部屋ごとに1〜2個にまとめ、影を落とす光にする（壁や閉じたドアでさえぎられ、開けたドアからは光が入る）
  const byRoom = new Map();
  let outN = 0;
  for(const lp of lightPts){
    // 屋外（どの部屋にも入っていない）の照明は、1灯ずつ別々に照らす
    const rm = roomAt(lp.x/M, lp.z/M) || ('out' + (outN++));
    if(!byRoom.has(rm)) byRoom.set(rm, []);
    byRoom.get(rm).push(lp);
  }
  let shadowBudget = 12;
  const shadowLight = (pl, far) => {
    if(shadowBudget <= 0) return;
    shadowBudget--;
    pl.castShadow = true; pl.shadow.mapSize.set(256, 256); pl.shadow.bias = -.004;
    if('normalBias' in pl.shadow) pl.shadow.normalBias = .02;
    pl.shadow.camera.near = .05; pl.shadow.camera.far = far;
  };
  R3.shadowLight = shadowLight;
  for(const [rm, lps] of byRoom){
    const indoor = typeof rm !== 'string';
    const bb = indoor ? bbox(rm) : null, span = bb ? Math.max(bb.w, bb.h)*M : 3;

    const longX = !bb || bb.w >= bb.h;

      RB(W*.3, .06, .01, .005, 0, H*.78, fz + .004, mat('#D9D6CF'));
      for(const sx of [-1, 1]) Cy(.02, .02, .35, sx*W*.2, .2, fz - .05, mat('#C9CCCE', {roughness:.4, metalness:.4}));
      break;
    }
    case 'kyuto': case 'pcs': case 'meter': case 'vent': {
      // 壁に取り付ける設備（取付高さ＝下端の高さ）
      const y0 = (f.mh ?? furnOf(f.ftype).mh ?? 0)/1000;
      if(f.ftype === 'vent'){
        const hood = RB(W, H, D, .008, 0, y0 + H/2, bz + D/2);
        for(let i=0; i<3; i++) B(W*.8, .006, .004, 0, y0 + H*.25 + i*H*.2, fz + .002, mat('#3F3C39'));
      } else {
        RB(W, H, D, .01, 0, y0 + H/2, 0);
        if(f.ftype === 'kyuto'){
          for(let i=0; i<5; i++) B(W*.6, .008, .004, 0, y0 + H*.15 + i*.03, fz + .002, mat('#8E9296'));
          B(W*.7, Math.min(.35, y0), .08, 0, y0 - Math.min(.35, y0)/2, bz + .04, mat('#E6E5E1'));
        } else if(f.ftype === 'meter'){
          B(W*.7, H*.4, .01, 0, y0 + H*.65, fz + .004, mat('#BCD0DC', {roughness:.05, metalness:.2, transparent:true, opacity:.6}));
          B(W*.5, H*.18, .006, 0, y0 + H*.25, fz + .003, mat('#3A3F44'));
        } else {
          B(W*.5, .02, .004, 0, y0 + H*.8, fz + .002, mat('#6AA06A', {emissive:new T.Color('#3E7A3E'), emissiveIntensity:.5}));
          B(W*.9, .004, .004, 0, y0 + H*.45, fz + .002, mat('#CFCDC7'));
        }
      }
      break;
    }
    case 'faucet': {
      const bw = Math.min(W, D);
      Cy(bw*.45, bw*.42, .06, 0, .03, 0, mat('#C9CCCE', {roughness:.7}));
      B(.06, H, .06, 0, H/2, -bw*.2);
      Cy(.012, .012, .08, 0, H - .12, -bw*.2 + .06, mat('#B8BEC4', {roughness:.2, metalness:.8})).rotation.x = Math.PI/2;
      break;
    }
    case 'dl': case 'ceil': case 'pend': case 'spot': case 'linel': case 'pole': case 'cube': case 'softcream': {
      // 照明（天井のものはグループを絶対高さ0に置き天井＝WALL_H。地面に置くものは足元が原点）（グループは床ではなく絶対高さ0に置く。天井＝WALL_H）
      const CH = WALL_H - .003, on = f.on !== false, lc = lightCol(f), dim = lightDim(f)/100;
      // 発光面は白飛びしないように控えめに（明るさ100%でも1.0まで）
      const glow = new T.MeshStandardMaterial({color:C(on ? '#FFFFFF' : '#E4E4E4'), emissive:new T.Color(lc), emissiveIntensity:on ? .15 + dim*.85 : 0, roughness:.4});
      const pts = [];
      if(f.ftype === 'dl'){
        const rr = Math.max(.03, W/2);
        const ring = put(new T.CylinderGeometry(rr, rr, .008, 28), main, 0, CH - .004, 0);
        put(new T.CylinderGeometry(rr*.8, rr*.8, .004, 28), glow, 0, CH - .009, 0);
        pts.push([0, CH - .15, 0, .9, .55]);
      } else if(f.ftype === 'ceil'){
        const rr = Math.max(.1, W/2), hh = Math.max(.04, Math.min(H, .2));
        put(new T.CylinderGeometry(rr*.98, rr*.98, .02, 40), main, 0, CH - .01, 0);
        const dome = put(new T.SphereGeometry(rr, 36, 12, 0, Math.PI*2, 0, Math.PI/2), glow, 0, CH - .02, 0);
        dome.rotation.x = Math.PI; dome.scale.y = hh/rr;
        pts.push([0, CH - hh - .2, 0, 1.6, Math.max(.9, rr*2.4)]);
      } else if(f.ftype === 'pend'){
        const hang = clamp(H, .1, 2.0), rr = Math.max(.05, W/2), y0 = CH - hang;
        put(new T.CylinderGeometry(.04, .04, .02, 20), main, 0, CH - .01, 0);
        put(new T.CylinderGeometry(.003, .003, hang, 6), dark, 0, CH - hang/2, 0);
        const shadeM = mat(col, {roughness:.45, metalness:.4, side:T.DoubleSide});
        put(new T.CylinderGeometry(rr*.18, rr, rr*.75, 32, 1, true), shadeM, 0, y0 - rr*.375, 0);
        put(new T.SphereGeometry(rr*.2, 16, 10), glow, 0, y0 - rr*.55, 0);
        pts.push([0, y0 - rr*.8, 0, 1.1, 0]);
      } else if(f.ftype === 'spot'){
        put(new T.BoxGeometry(W, .025, .035), mat(col, {roughness:.4, metalness:.4}), 0, CH - .0125, 0);
        const n = Math.max(1, Math.round(W/.4));
        for(let i=0; i<n; i++){
          const x = -W/2 + (i + .5)*W/n;
          put(new T.BoxGeometry(.02, .06, .02), mat(col), x, CH - .055, 0);
          const can = put(new T.CylinderGeometry(.035, .03, .12, 20), mat(col, {roughness:.4, metalness:.4}), x, CH - .11, .03);
          can.rotation.x = .5;
          const lens = put(new T.CylinderGeometry(.028, .028, .004, 20), glow, x, CH - .16, .06); lens.rotation.x = .5;
          pts.push([x, CH - .35, .15, .7, .35]);
        }
      } else if(f.ftype === 'pole'){
        // ポールライト：細い柱の上に光る部分
        const rr = Math.max(.04, W/2), ph = Math.max(.2, H);
        Cy(rr*1.3, rr*1.4, .03, 0, .015, 0, main);
        Cy(rr*.55, rr*.6, ph - .2, 0, (ph - .2)/2, 0, main);
        put(new T.CylinderGeometry(rr*.9, rr*.9, .16, 24), glow, 0, ph - .12, 0);
        Cy(rr*1.05, rr*1.05, .04, 0, ph - .02, 0, main);
        pts.push([0, ph - .12, 0, .55, 0]);
      } else if(f.ftype === 'cube'){
        // キューブライト：全体がやわらかく光る四角
        B(W, .015, D, 0, .0075, 0, mat('#3A3D40'));
        put(rboxGeo(T, W, Math.max(.05, H - .015), D, .008), glow, 0, .015 + Math.max(.05, H - .015)/2, 0);
        pts.push([0, H*.6, 0, .35, 0]);
      } else if(f.ftype === 'softcream'){
        // ソフトクリームライト：黒い丸台座＋ワッフルコーン＋縁のカップ＋渦巻きクリーム（先端がくるっと曲がる）
        const Rw = Math.max(.08, W/2), Ht = Math.max(.3, H);
        const coneM = new T.MeshStandardMaterial({map:getTex('waffle', '#E9A64C'), color:0xffffff, roughness:.7, emissive:new T.Color('#FF9A2E'), emissiveIntensity:on ? .18 + dim*.45 : 0});
        coneM.userData.keepMap = true; coneM.map.repeat.set(3, 1.2);
        const rimM = new T.MeshStandardMaterial({color:C('#EDA848'), roughness:.45, emissive:new T.Color('#FF9A2E'), emissiveIntensity:on ? .2 + dim*.5 : 0});
        const creamM = new T.MeshStandardMaterial({color:C('#F8F8F5'), roughness:.55, emissive:new T.Color(lc), emissiveIntensity:on ? .3 + dim*.7 : 0});
        const baseH = Ht*.04, coneTop = Ht*.30, rimTop = Ht*.46;
        Cy(Rw*.52, Rw*.56, baseH, 0, baseH/2, 0, main);                                       // 台座
        put(new T.CylinderGeometry(Rw*.7, Rw*.42, coneTop - baseH, 36, 1, false), coneM, 0, baseH + (coneTop - baseH)/2, 0);   // ワッフル部分
        put(new T.CylinderGeometry(Rw*.8, Rw*.7, rimTop - coneTop, 40), rimM, 0, coneTop + (rimTop - coneTop)/2, 0);            // 縁（カップ）
        const lip = put(new T.TorusGeometry(Rw*.795, Rw*.03, 10, 40), rimM, 0, rimTop, 0); lip.rotation.x = Math.PI/2;
        // クリーム：4段の丸いふくらみを回転体で作る。根元はカップより少し太く、上へ行くほど細く、てっぺんは丸く
        const creamTop = Ht*.90, pts2 = [], tiers = 4;
        for(let i=0; i<=120; i++){
          const t = i/120, y = rimTop + (creamTop - rimTop)*t;
          const Rt = Rw*(.98 - .5*t), frac = (t*tiers) % 1;
          let r2 = Rt*(.84 + .16*Math.sin(Math.PI*frac));
          if(t > .8) r2 *= Math.sqrt(Math.max(0, (1 - t)/.2));
          pts2.push(new T.Vector2(Math.max(.002, r2), y));
        }
        put(new T.LatheGeometry(pts2, 56), creamM, 0, 0, 0);
        // 先端のくるっと曲がった部分
        const hr = Rw*.2, curl = put(new T.TorusGeometry(hr, Rw*.08, 12, 28, Math.PI*1.25), creamM, Rw*.05, creamTop + hr*.35, 0);
        curl.rotation.z = -Math.PI*.15;
        put(new T.SphereGeometry(Rw*.08, 12, 10), creamM, Rw*.05 + hr*Math.cos(Math.PI*1.1), creamTop + hr*.35 + hr*Math.sin(Math.PI*1.1), 0);
        pts.push([0, (rimTop + creamTop)/2, 0, .8, 0]);
      } else {
        put(new T.BoxGeometry(W, .012, Math.max(.03, D)), main, 0, CH - .006, 0);
        put(new T.BoxGeometry(W - .02, .004, Math.max(.02, D) - .015), glow, 0, CH - .014, 0);
        for(let i=0, n = Math.max(1, Math.round(W/1.2)); i<n; i++) pts.push([-W/2 + (i + .5)*W/n, CH - .2, 0, 1.0, .7]);
      }
      g.userData.lightPts = on ? pts.map(([x, y, z, k, hr]) => ({x, y, z, color:lc, k:k*(.05 + dim*.75), hr, dim})) : [];
      // 3Dで器具をタップすると、このライトだけオン・オフ
      const tapObj = {id:'lt:' + f.id, fid:f.id, type:'lighttap', t:0, target:0, seg:null, apply(){}, meshes:[], onTap(){ const it = getItem(f.id); if(!it) return; it.on = it.on === false; save(); scheduleRender(); build3D(); toast(`${furnOf(it.ftype).name}を${it.on ? 'つけました' : '消しました'}`); }};
      g.traverse(o => { if(o.isMesh){ o.userData.door = tapObj; tapObj.meshes.push(o); } });
      g.userData.doorObj = tapObj;
      break;
    }
    default: RB(W, H, D, .01, 0, H/2, 0);
  }
  return g;
}

/* ----- 車（諸元の寸法で作り、家具の寸法に合わせて拡大縮小） ----- */
function buildCar(T, g, sp, col, W, D, H){
  const C = c => new T.Color(c).convertSRGBToLinear();
  const car = new T.Group(); g.add(car);
  const paint = new T.MeshStandardMaterial({color:C(col), roughness:.28, metalness:.35});
  const glassM = new T.MeshStandardMaterial({color:C('#232B33'), roughness:.08, metalness:.45});
  const black = new T.MeshStandardMaterial({color:C('#17191B'), roughness:.6});
  const tireM = new T.MeshStandardMaterial({color:C('#1C1D1F'), roughness:.85});
  const rimM = new T.MeshStandardMaterial({color:C(sp.rim), roughness:.25, metalness:.75});
  const {L, r, clr, belt, hoodF, noseY} = sp, zf = L/2 - sp.fo, zr = zf - sp.wb, ra = r + .035;
  const put = (geo, m, x, y, z) => { const me = new T.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true; car.add(me); return me; };
  // 横から見た形を幅方向に押し出す（x＝車の前後, y＝高さ）
  const extrudeSide = (shape, width, bev, m) => {
    const geo = new T.ExtrudeGeometry(shape, {depth:Math.max(.01, width - 2*bev), bevelEnabled:bev > 0, bevelThickness:bev, bevelSize:bev, bevelSegments:4, curveSegments:18});
    geo.rotateY(-Math.PI/2); geo.computeBoundingBox();
    const bb = geo.boundingBox; geo.translate(-(bb.min.x + bb.max.x)/2, 0, 0);
    return put(geo, m, 0, 0, 0);
  };
  const wz = L/2 - sp.wsBase;
  // 下半分のボディ（タイヤの部分はアーチで切り欠く）
  const b = new T.Shape();
  b.moveTo(-L/2 + .08, clr + .05);
  b.lineTo(-L/2, .34); b.lineTo(-L/2 + .015, belt - .08); b.quadraticCurveTo(-L/2 + .03, belt, -L/2 + sp.hatch + .03, belt);
  b.lineTo(wz, belt + .02);
  b.quadraticCurveTo(L/2 - .3, hoodF + .03, L/2 - .05, hoodF - .05);
  b.quadraticCurveTo(L/2, hoodF - .08, L/2, noseY);
  b.lineTo(L/2 - .02, clr + .14); b.quadraticCurveTo(L/2 - .04, clr, L/2 - .14, clr);
  b.lineTo(zf + ra, clr); b.lineTo(zf + ra, r); b.absarc(zf, r, ra, 0, Math.PI, false); b.lineTo(zf - ra, clr);
  b.lineTo(zr + ra, clr); b.lineTo(zr + ra, r); b.absarc(zr, r, ra, 0, Math.PI, false); b.lineTo(zr - ra, clr);
  b.lineTo(-L/2 + .08, clr);
  extrudeSide(b, sp.W, .06, paint);
  // 窓まわり（キャビン）：濃いガラス
  const cw = sp.W*sp.cabinW, top = sp.H;
  const c = new T.Shape();
  c.moveTo(-L/2 + sp.hatch + .05, belt - .01);
  c.lineTo(-L/2 + sp.roofR, top - .06);
  c.quadraticCurveTo((-L/2 + sp.roofR + L/2 - sp.roofF)/2, top + .005, L/2 - sp.roofF, top - .04);
  c.lineTo(wz - .02, belt + .01);
  c.lineTo(-L/2 + sp.hatch + .05, belt - .01);
  extrudeSide(c, cw, .05, glassM);
  // 屋根（ボディ色）
  const rf = new T.Shape(), rz0 = -L/2 + sp.roofR + .03, rz1 = L/2 - sp.roofF - .06;
  rf.moveTo(rz0, top - .075);
  rf.quadraticCurveTo((rz0 + rz1)/2, top - .015, rz1, top - .06);
  rf.lineTo(rz1, top - .03); rf.quadraticCurveTo((rz0 + rz1)/2, top + .012, rz0, top - .04); rf.lineTo(rz0, top - .075);
  extrudeSide(rf, cw + .02, .02, paint);
  // ピラー：Aピラー（ボディ色）、Bピラー（黒）、Cピラー（ボディ色。ゴルフは太め）
  const side = (pts, m) => { const sh = new T.Shape(pts.map(([z, y]) => new T.Vector2(z, y))); for(const sx of [-1, 1]){ const e = new T.ExtrudeGeometry(sh, {depth:.012, bevelEnabled:false}); e.rotateY(-Math.PI/2); const me = put(e, m, sx > 0 ? cw/2 + .013 : -cw/2 - .001, 0, 0); } };
  const aT = L/2 - sp.roofF, cT = -L/2 + sp.roofR;
  side([[wz - .02, belt + .01], [wz + .06, belt + .01], [aT + .02, top - .05], [aT - .06, top - .05]], paint);
  const bz = (wz + aT)/2 - .55;
  side([[bz - .04, belt], [bz + .04, belt], [bz + .03, top - .06], [bz - .03, top - .06]], black);
  side(sp.golf ? [[-L/2 + sp.hatch + .05, belt], [-L/2 + .78, belt], [cT + .25, top - .06], [cT - .01, top - .06]]
               : [[-L/2 + sp.hatch + .05, belt], [-L/2 + .42, belt], [cT + .12, top - .06], [cT - .01, top - .06]], paint);
  // ドアミラー
  for(const sx of [-1, 1]){ const m = new T.Mesh(rboxGeo(T, .09, .1, .2, .03), paint); m.position.set(sx*(sp.W/2 + .03), belt + .07, wz - .12); m.castShadow = true; car.add(m); }
  // ライト・グリル・ナンバープレート
  const lamp = new T.MeshStandardMaterial({color:C('#E9EEF2'), roughness:.1, metalness:.3, emissive:C('#9FB3C4'), emissiveIntensity:.15});
  const tail = new T.MeshStandardMaterial({color:C('#7C1A1C'), roughness:.2, emissive:C('#5A0E10'), emissiveIntensity:.4});
  for(const sx of [-1, 1]){
    put(new T.BoxGeometry(sp.W*.26, .06, .03), lamp, sx*sp.W*.29, hoodF - .1, L/2 - .035);
    put(new T.BoxGeometry(sp.W*.22, .07, .03), tail, sx*sp.W*.33, belt - .08, -L/2 + .01);
  }
  if(sp.golf) put(new T.BoxGeometry(sp.W*.34, .012, .02), lamp, 0, hoodF - .085, L/2 - .03);
  put(new T.BoxGeometry(sp.W*.5, .16, .03), black, 0, clr + .2, L/2 - .025);
  put(new T.BoxGeometry(sp.W*.36, .05, .02), black, 0, hoodF - .16, L/2 - .02);
  const plate = new T.MeshStandardMaterial({color:C('#F4F4F0'), roughness:.4});
  put(new T.BoxGeometry(.33, .165, .01), plate, 0, clr + .26, L/2 + .002);
  put(new T.BoxGeometry(.33, .165, .01), plate, 0, .58, -L/2 - .002);
  put(new T.BoxGeometry(sp.W - .2, .08, L - .5), black, 0, clr + .04, 0);
  // タイヤとホイール
  for(const zz of [zf, zr]) for(const sx of [-1, 1]){
    const x = sx*sp.tr/2;
    const t = put(new T.CylinderGeometry(r, r, .205, 32), tireM, x, r, zz); t.rotation.z = Math.PI/2;
    const rim = put(new T.CylinderGeometry(r*.66, r*.66, .21, 28), rimM, x, r, zz); rim.rotation.z = Math.PI/2;
    const hub = put(new T.CylinderGeometry(r*.5, r*.5, .212, 20), new T.MeshStandardMaterial({color:C('#6F757A'), roughness:.4, metalness:.6}), x, r, zz); hub.rotation.z = Math.PI/2;
    for(let k=0; k<5; k++){
      const sp2 = put(new T.BoxGeometry(.216, r*.95, .035), rimM, x, r, zz);
      sp2.rotation.x = k*Math.PI*2/5;
    }
  }
  // 家具として入力された寸法に合わせる
  car.scale.set(W/sp.W, H/sp.H, D/L);
}

/* ----- 視点の操作 ----- */
function fitRadius(){
  const b = allBBox(), w = b.w*M + 1.5, h = b.h*M + 1.5, asp = R3.camera.aspect || 1;
  const half = Math.tan(R3.camera.fov*Math.PI/360);
  return Math.max(h, w/asp)/2/half * 1.15;
}
function updateCam(){
  const o = orbit, c = R3.camera;
  c.position.set(o.tx + o.r*Math.sin(o.phi)*Math.sin(o.theta), o.ty + o.r*Math.cos(o.phi), o.tz + o.r*Math.sin(o.phi)*Math.cos(o.theta));
  c.lookAt(o.tx, o.ty, o.tz);
}
const easeIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function tweenTo(target, ms, onUpdate){
  const from = {...orbit}, t0 = performance.now(), dur = reduceMotion() ? 1 : ms;
  if(target.theta !== undefined){ // 近い向きへ回る
    let d = target.theta - from.theta; d = ((d + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI; target = {...target, theta:from.theta + d};
  }
  tweens = [{from, target, t0, dur, onUpdate}];
}
function defaultView(){
  const r = fitRadius();
  return {theta:-0.65, phi:0.95, r:r*1.05, tx:R3.center[0], ty:0.3, tz:R3.center[1]};
}
function bindOrbit(el){
  const pts = new Map(); let g = null, down = null;
  const pair = () => { const [a,b] = [...pts.values()]; return {d:Math.hypot(a.x-b.x, a.y-b.y) || 1, m:{x:(a.x+b.x)/2, y:(a.y+b.y)/2}}; };
  const pan = (dx, dy) => {
    const k = orbit.r*0.0017, th = orbit.theta;
    orbit.tx -= (Math.cos(th)*dx + Math.sin(th)*dy)*k;
    orbit.tz -= (-Math.sin(th)*dx + Math.cos(th)*dy)*k;
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); tweens = [];
    if(pts.size === 1){
      down = {x:e.clientX, y:e.clientY, t:performance.now(), moved:false};
      // ライトを長押し → その場で調整パネル
      const fid = pickLight(e.clientX, e.clientY), dn = down;
      if(fid) dn.lt = setTimeout(() => { if(down === dn && !dn.moved){ dn.long = true; g = null; openLightPop(fid, dn.x, dn.y); } }, 500);
    }
    else down = null;
    if(pts.size === 2 && !walk){ const p = pair(); g = {type:'pinch', d0:p.d, m0:p.m, r0:orbit.r}; }
    else if(pts.size === 1) g = {type:walk ? 'look' : ((e.button === 2 || e.shiftKey) ? 'pan' : 'rot'), x:e.clientX, y:e.clientY, mouse:e.pointerType === 'mouse'};
  });
  el.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(down && Math.hypot(e.clientX-down.x, e.clientY-down.y) > 8){ down.moved = true; clearTimeout(down.lt); }
    if(!g) return;
    if(g.type === 'pinch' && pts.size === 2){
      const p = pair();
      orbit.r = clamp(g.r0*g.d0/p.d, 1.5, 300);
      pan(p.m.x - g.m0.x, p.m.y - g.m0.y); g.m0 = p.m;
      return;
    }
    const dx = e.clientX - g.x, dy = e.clientY - g.y; g.x = e.clientX; g.y = e.clientY;
    if(g.type === 'look'){ player.yaw += (g.mouse ? 1 : -1)*dx*0.005;   // マウスは左右逆（景色をつかんで動かす向き：右へドラッグで左を向く）
      player.pitch = clamp(player.pitch - dy*0.005, -1.2, 1.2); }
