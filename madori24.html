/* タップ：扉なら開閉、歩行中に床ならそこへ歩く */
function tap3D(cx, cy){
  const T = window.THREE, rc = R3.renderer.domElement.getBoundingClientRect();
  const v = new T.Vector2(((cx - rc.left)/rc.width)*2 - 1, -((cy - rc.top)/rc.height)*2 + 1);
  R3.ray.setFromCamera(v, R3.camera);
  const hits = R3.ray.intersectObjects(R3.doorMeshes, false);
  if(hits.length){
    const d = hits[0].object.userData.door;
    if(d.onTap){ d.onTap(); return; }
    d.target = d.target ? 0 : 1; doorState[d.id] = !!d.target;
    return;
  }
  if(walk){
    const fh = R3.ray.intersectObjects(R3.floors, false);
    if(fh.length){ const p = fh[0].point; player.target = {x:p.x, z:p.z}; player.stuck = 0; }
  }
}

/* 壁・扉との当たり判定（円と線分） */
function collide(px, pz){
  const lv = playerLevel();
  const segs = R3.colliders.filter(c => (c[5] || 1) === lv).concat(R3.doors.filter(d => (d.level || 1) === lv).map(d => d.seg).filter(Boolean));
  for(let it=0; it<4; it++){
    for(const [ax, az, bx, bz, ht] of segs){
      const dx = bx-ax, dz = bz-az, L2 = dx*dx + dz*dz;
      let t = L2 ? ((px-ax)*dx + (pz-az)*dz)/L2 : 0; t = clamp(t, 0, 1);
      const qx = ax + t*dx, qz = az + t*dz;
      let ex = px - qx, ez = pz - qz; const d = Math.hypot(ex, ez), min = PR + ht;
      if(d < min){
        if(d < 1e-6){ const l = Math.sqrt(L2) || 1; ex = -dz/l; ez = dx/l; px = qx + ex*min; pz = qz + ez*min; }
        else { px = qx + ex/d*min; pz = qz + ez/d*min; }
      }
    }
  }
  return [px, pz];
}
function movePlayer(strafe, fwd){
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const nx = player.x + (-sy*fwd + cy*strafe), nz = player.z + (-cy*fwd - sy*strafe);
  const [x, z] = collide(nx, nz); player.x = x; player.z = z;
}
/* 階段の上の高さ：手前の端から奥へ何割進んだかで段の高さを決める（家具の位置と向きから計算） */
function stairRamp(f, S2){
  const b2 = bbox(f), Dd = (f.fd || 3640)/1000, th = -(f.rot || 0)*Math.PI/180;
  const cx = (b2.x + b2.w/2)*M, cz = (b2.y + b2.h/2)*M, fx = Math.sin(th), fz = Math.cos(th);   // 手前（1段目）の向き
  return {P:[[b2.x, b2.y], [b2.x + b2.w, b2.y], [b2.x + b2.w, b2.y + b2.h], [b2.x, b2.y + b2.h]], lvl:0,
    ramp:(x, z) => { const proj = (x - cx)*fx + (z - cz)*fz, u = clamp((Dd/2 - proj)/Dd, 0, 1); return Math.min(S2.total, (Math.floor(u*S2.n - 1e-6) + 1)*S2.rh); }};
}
function floorLevelAt(x, z, footY){
  const cx = x/M, cz = z/M, p = {x:cx, y:cz};
  const inF = f => inPoly(p, f.P) && !(f.holes && f.holes.some(H2 => inPoly(p, H2)));
  if(buildLevel){                                   // 組み立て中：その階の床だけ（階の中での高さ）
    for(const f of R3.floorInfo) if(f.level == null && inF(f)) return f.ramp ? f.ramp(x, z) : f.lvl;
    return buildLevel > 1 ? 0 : BASE;
  }
  // 歩いているとき：足もとより少し上（段差0.45m）までのうち一番高い床に立つ。階段は段ごとの高さ
  const fy = footY ?? player.fy ?? 0;
  let best = null, low = null;
  for(const f of R3.floorInfo){
    if(!inF(f)) continue;
    if(f.level > 1 && hide2F) continue;
    const y = levelY(f.level || 1) + (f.ramp ? f.ramp(x, z) : f.lvl);
    if(y <= fy + .45 && (best === null || y > best)) best = y;
    if(low === null || y < low) low = y;
  }
  return best ?? low ?? BASE;
}
function spawnPlayer(){
  const rooms = items.filter(i => i.kind !== 'door' && i.kind !== 'stroke' && i.kind !== 'furn' && i.kind !== 'roof' && i.kind !== 'land' && i.kind !== 'ext' && i.kind !== 'eline' && i.type !== 'porch');
  const r1 = rooms.filter(i => flr(i) === 1); if(r1.length) rooms.splice(0, rooms.length, ...r1);
  const pick = rooms.find(i => i.type === 'entry') || rooms.find(i => i.type === 'ldk')
    || rooms.slice().sort((a,b) => cellArea(b) - cellArea(a))[0];
  const c = pick ? labelPoint(pick) : {x:R3.center[0]/M, y:R3.center[1]/M};
  player.x = c.x*M; player.z = c.y*M;
  const tx = R3.center[0] - player.x, tz = R3.center[1] - player.z;
  player.yaw = (Math.abs(tx) + Math.abs(tz) > 0.3) ? Math.atan2(-tx, -tz) : 0;
  player.pitch = -0.08; player.target = null;
  const [x, z] = collide(player.x, player.z); player.x = x; player.z = z;

/* 天井・室内照明は「屋根あり＋歩いてみる」のときだけ */

let shadowDirty = true, lastShadowT = 0;

let lastT = 0;
function loop3D(now){

  if(R3.roombas) for(const rb of R3.roombas) roombaStep(rb, dt);
  // 扉の開閉アニメーション
  for(const d of R3.doors){
    if(d.t !== d.target){ d.t = d.target > d.t ? Math.min(1, d.t + dt*2.2) : Math.max(0, d.t - dt*2.2); d.apply(d.t); if(d.type === 'shade') updateDaylight(); requestShadow(); }
  }

        player.yaw += dy*Math.min(1, dt*6);

}

/* ===== 太陽の動き（季節・時刻・緯度から位置を計算） ===== */
const sunSim = {season:'eq', time:10, playing:false, speed:40};
const SEASONS = {eq:0, sum:23.44, win:-23.44};                      // 太陽の赤緯（度）
const LATS = [['北海道（43°）', 43], ['東北北部（40°）', 40], ['東北南部（38°）', 38], ['関東・北陸（36°）', 36], ['東海・近畿（35°）', 35], ['中国・四国（34°）', 34], ['九州（33°）', 33], ['沖縄（26°）', 26]];
const NORTHS = [['上', 0], ['右上', 45], ['右', 90], ['右下', 135], ['下', 180], ['左下', 225], ['左', 270], ['左上', 315]];
const sunSpeedH = () => 0.02*Math.pow(10, sunSim.speed/40);        // 1秒あたりに進む時間(h)
function sunVec(time, season){
  const φ = (settings.lat ?? 36)*Math.PI/180, δ = (SEASONS[season ?? sunSim.season] || 0)*Math.PI/180, h = ((time ?? sunSim.time) - 12)*15*Math.PI/180;
  const e = -Math.cos(δ)*Math.sin(h), n = Math.cos(φ)*Math.sin(δ) - Math.sin(φ)*Math.cos(δ)*Math.cos(h), u = Math.sin(φ)*Math.sin(δ) + Math.cos(φ)*Math.cos(δ)*Math.cos(h);
  const th = (settings.north || 0)*Math.PI/180;                   // 図面上の北の向き（0＝上）
  return [e*Math.cos(th) + n*Math.sin(th), u, e*Math.sin(th) - n*Math.cos(th)];
}
function sunTimes(){
  const φ = (settings.lat ?? 36)*Math.PI/180, δ = (SEASONS[sunSim.season] || 0)*Math.PI/180;
  const c = clamp(-Math.tan(φ)*Math.tan(δ), -1, 1), H0 = Math.acos(c)*180/Math.PI/15;
  const noonEl = 90 - Math.abs((settings.lat ?? 36) - (SEASONS[sunSim.season] || 0));

}
const hhmm = t => { const m = Math.round(((t % 24) + 24) % 24*60); return `${String(Math.floor(m/60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
function mixHex(a, b, t){ const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16), f = (x, y) => Math.round(x + (y - x)*t); return `rgb(${f(A>>16, B>>16)},${f(A>>8&255, B>>8&255)},${f(A&255, B&255)})`; }
function applySun(){

  const [cx, cz] = R3.center, dist = R3.size*1.2 + 25;
  R3.sun.position.set(cx + dx*dist, dy*dist, cz + dz*dist); R3.sun.target.position.set(cx, 0, cz);
  const day = clamp((el + 0.05)/0.3, 0, 1), low = clamp(1 - el/0.35, 0, 1);

}
const sunMode = () => $('sunPanel').classList.contains('open');
/* 窓からの採光：窓に入る光＝面積 ×（空の明るさ＋直射の当たり具合）× ガラス・シェードの透過率 */
function updateDaylight(){
  if(!R3 || !R3.dayLights) return;
  const interior = walk && settings.roofShow && !wallLow, on = sunMode() && interior;
  R3.dayG.visible = on;
  if(!on) return;
  const [sx, sy, sz] = sunVec(), el = Math.asin(clamp(sy, -1, 1)), day = clamp((el + .05)/.3, 0, 1);
  const fT = settings.frostT ?? .5, sT = settings.shadeT ?? .3;

    let amt = 0;
    for(const w of dl.ws){
      const direct = el > 0 ? Math.max(0, sx*w.nx + sz*w.nz) : 0;
      const shadeClosed = w.shade ? easeIO(w.shade.t) : 0;

/* ===== ルンバの掃除 ===== */
const roombaState = {};
function toggleRoomba(rb){
  if(rb.state === 'dock'){ rb.state = 'clean'; rb.t = 0; rb.head = rb.yaw0; roombaState[rb.id] = 'clean'; toast('ルンバが掃除を始めました（もう一度タップで基地へ戻ります）'); }
  else { rb.state = 'return'; rb.t = 0; roombaState[rb.id] = 'dock'; toast('ルンバが基地へ戻ります'); }
}
// 置いてある部屋の中で、壁・家具・閉じたドアから離れた場所だけ走れる
function roombaOK(rb, x, z){
  const r = .19;
  if(rb.poly){
    const p = {x:x/M, y:z/M}; if(!inPoly(p, rb.poly)) return false;
    for(let i=0; i<rb.poly.length; i++) if(distSeg([p.x, p.y], rb.poly[i], rb.poly[(i+1) % rb.poly.length])*M < r + .06) return false;
  } else if(Math.hypot(x - rb.home.x, z - rb.home.z) > 3) return false;
  for(const sg of R3.colliders) if((sg[5] || 1) === (rb.level || 1) && distSeg([x, z], [sg[0], sg[1]], [sg[2], sg[3]]) < r + sg[4]) return false;
  for(const d of R3.doors) if(d.seg && (d.level || 1) === (rb.level || 1) && distSeg([x, z], [d.seg[0], d.seg[1]], [d.seg[2], d.seg[3]]) < r + d.seg[4]) return false;
  return true;
}
function roombaStep(rb, dt){
  if(rb.state === 'dock') return;
  rb.t += dt; rb.brush.rotation.y += dt*20;
  if(rb.state === 'clean' && rb.t > 150){ rb.state = 'return'; rb.t = 0; roombaState[rb.id] = 'dock'; }
  const sp = .3;
  if(rb.state === 'return'){
    const dx = rb.home.x - rb.x, dz = rb.home.z - rb.z, dist = Math.hypot(dx, dz);
    if(dist < .06 || rb.t > 45){ rb.state = 'dock'; rb.x = rb.home.x; rb.z = rb.home.z; rb.head = rb.yaw0; rb.robot.position.set(rb.x, rb.y, rb.z); rb.robot.rotation.y = rb.head; return; }
    if(rb.bumpT <= 0){ const want = Math.atan2(dx, dz); let d2 = ((want - rb.head + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; rb.head += clamp(d2, -dt*3, dt*3); }
  } else if(Math.random() < dt*.08) rb.head += (Math.random() - .5)*.8;       // ときどき少し向きを変える
  rb.bumpT -= dt;
  const nx = rb.x + Math.sin(rb.head)*sp*dt, nz = rb.z + Math.cos(rb.head)*sp*dt;
  const nearHome = rb.state === 'return' && Math.hypot(nx - rb.home.x, nz - rb.home.z) < .35;
  // すでに家具などに重なっている位置からは、抜け出す方向へ動けるようにする
  if(nearHome || roombaOK(rb, nx, nz) || !roombaOK(rb, rb.x, rb.z)){ rb.x = nx; rb.z = nz; }
  else { rb.head += (Math.PI*.55 + Math.random()*Math.PI*.8)*(Math.random() < .5 ? 1 : -1); rb.bumpT = .9; }
  rb.robot.position.set(rb.x, rb.y, rb.z); rb.robot.rotation.y = rb.head;
}

/* ===== 3Dでライトを長押しして調整するパネル ===== */
function pickLight(cx, cy){
  if(!R3 || !R3.doorMeshes) return null;
  const T = window.THREE, rc = R3.renderer.domElement.getBoundingClientRect();
  const v = new T.Vector2(((cx - rc.left)/rc.width)*2 - 1, -((cy - rc.top)/rc.height)*2 + 1);
  R3.ray.setFromCamera(v, R3.camera);
  const hits = R3.ray.intersectObjects(R3.doorMeshes, false);
  const d = hits.length ? hits[0].object.userData.door : null;
  return d && d.type === 'lighttap' ? d.fid : null;
}

  $('btn3d').textContent = '…';
  try{ await loadThree(); }
  catch(_){ $('btn3d').textContent = '3D'; toast('3D表示を読み込めませんでした（インターネット接続が必要です）'); return; }
